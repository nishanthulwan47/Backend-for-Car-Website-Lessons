<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Blocker – Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Site Blocker</h1>
        <label class="switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </label>
        <span id="statusText" class="status">Disabled</span>
      </header>

      <section class="add">
        <h2>Add a domain to block</h2>
        <form id="addForm">
          <input id="domainInput" type="text" placeholder="e.g. facebook.com" autocomplete="off" required />
          <button type="submit">Add</button>
        </form>
        <p class="hint">Do not include https:// or paths. Subdomains will also be blocked.</p>
      </section>

      <section class="list">
        <h2>Blocked domains (<span id="count">0</span>)</h2>
        <ul id="domainList"></ul>
      </section>

      <footer>
        <button id="exportBtn">Export</button>
        <label class="import">
          <input id="importFile" type="file" accept="application/json" hidden />
          <span class="btn-like">Import</span>
        </label>
        <button id="clearAllBtn" class="danger">Clear all</button>
      </footer>
    </main>

    <script src="options.js"></script>
  </body>
</html>
